<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Cards Manager</title>
<style>
:root{--bg:#f3f4f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--primary:#4f46e5;--primary-dark:#4338ca;--border:#e5e7eb;--error:#dc2626;--shadow:0 4px 14px #00000014;--shadow-hover:0 10px 24px #4f46e540}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,-apple-system,BlinkMacSystemFont,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif;line-height:1.5}.app{min-height:100vh}.app-header{background:linear-gradient(135deg,var(--primary),#ec4899);color:#fff;text-align:center;padding:2rem 1rem}.app-header h1{font-size:clamp(1.6rem,4vw,2.2rem)}.app-header p{opacity:.9;margin-top:.3rem}.app-main{display:grid;grid-template-columns:340px 1fr;align-items: start;gap:1.5rem;max-width:1200px;margin:0 auto;padding:1.5rem 1rem 3rem}.form-panel{position:sticky;top:1rem}.contact-form{background:var(--card);box-shadow:var(--shadow);display:flex;border-radius:14px;flex-direction:column;gap:.9rem;padding:1.5rem}.contact-form h2{font-size:1.25rem}.contact-form label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:600}.contact-form input,.contact-form textarea{border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;transition:border-color .2s,box-shadow .2s;font-family:inherit;font-size:.95rem}.contact-form textarea{resize:vertical}.contact-form input:focus,.contact-form textarea:focus,.search-bar input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px #4f46e533}.form-error{color:var(--error);font-size:.88rem;font-weight:600}.btn-primary{background:var(--primary);color:#fff;cursor:pointer;border:none;border-radius:8px;padding:12px;transition:background .2s,transform .2s;font-size:1rem;font-weight:600}.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px)}.search-bar{display:flex;align-items: center;gap:1rem;margin-bottom:1.2rem}.search-bar input{border:1.5px solid var(--border);background:var(--card);box-shadow:var(--shadow);border-radius:10px;flex:1;padding:12px 16px;font-size:1rem}.count{color:var(--muted);white-space:nowrap;font-size:.9rem}.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.2rem}.contact-card{position:relative;background:var(--card);box-shadow:var(--shadow);text-align:center;border-radius:14px;padding:1.5rem 1.2rem;transition:transform .25s,box-shadow .25s}.contact-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-6px)}.avatar{object-fit:cover;display:block;border:3px solid var(--primary);border-radius:50%;width:84px;height:84px;margin:0 auto .8rem}.avatar-initials{display:flex;background:linear-gradient(135deg,var(--primary),#ec4899);color:#fff;justify-content:center;align-items: center;font-size:1.8rem;font-weight:700}.contact-card h3{font-size:1.15rem}.card-role{color:var(--muted);margin-top:2px;font-size:.9rem}.card-role strong{color:var(--primary)}.card-bio{color:var(--muted);margin-top:.7rem;font-size:.9rem}.card-info{list-style:none;border-top:1px dashed var(--border);word-break:break-word;margin-top:.8rem;padding-top:.8rem;font-size:.88rem}.card-info li{margin-bottom:3px}.delete-btn{position:absolute;color:var(--muted);cursor:pointer;opacity:0;background:0 0;border:none;transition:opacity .2s,color .2s;font-size:1.4rem;line-height:1;top:8px;right:10px}.contact-card:hover .delete-btn,.delete-btn:focus{opacity:1}.delete-btn:hover{color:var(--error)}.empty-state{text-align:center;color:var(--muted);background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:2.5rem 1rem}@media (max-width:860px){.app-main{grid-template-columns:1fr}.form-panel{position:static}.delete-btn{opacity:1}}

</style>
</head>
